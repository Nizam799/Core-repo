name: Ansible Populate AAD Groups

on:
  pull_request_target:
    branches:
      - main
    paths:
      - "deployments/**/**/**/core_aad/**"
      - "deployments/**/**/**/core_role_definition/**"
      - "stacks/**/aad/**"
      - "stacks/**/role_definition/**"
      - ".github/workflows/ansible-populate-aad-groups.yml"
      - "ansible-azure-aad/**"
      - "!deployments/**/**/**/core_github_team/**"
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-ansible:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false #GitHub can cancel other in-progress matrix jobs if set to true(by default it would be true).
      matrix:  # Using matrix would create multiple jobs for each path specified
        paths: [./ansible-azure-aad/aad-az-grp-crp-dataplatform.yml , ./ansible-azure-aad/aad-az-grp-crp-cloudops.yml]
        environment: [prod , dev]
        exclude: #excludes the below mentioned combination. And we can use include to explicitly include other combinations if needed.
          - environment: prod
            paths: ./ansible-azure-aad/aad-az-grp-crp-dataplatform.yml
          - environment: dev
            paths: ./ansible-azure-aad/aad-az-grp-crp-cloudops.yml
    steps:
      - uses: actions/checkout@v4

      - name: echo
        run: echo "${{matrix.paths}} - ${{matrix.environment}}"
      
